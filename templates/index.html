<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Sentiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F3EF; --ink: #1F242B; --ink-soft: #6A7078; --line: #DAD9D2; --card: #FFFFFF;
    --positive: #4C7A5D; --negative: #B14F3A; --neutral: #7A7568; --accent: #2B5F5E; --accent-ink: #F3F3EF;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15181B; --ink: #ECEAE4; --ink-soft: #9BA0A6; --line: #2A2E32; --card: #1C2023;
      --positive: #74B58C; --negative: #E08D75; --neutral: #9C9A8E; --accent: #4FA8A6; --accent-ink: #0F1213;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15181B; --ink: #ECEAE4; --ink-soft: #9BA0A6; --line: #2A2E32; --card: #1C2023;
    --positive: #74B58C; --negative: #E08D75; --neutral: #9C9A8E; --accent: #4FA8A6; --accent-ink: #0F1213;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .wrap { width: 100%; max-width: 560px; padding: 56px 24px 64px; }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif; font-weight: 600;
    font-size: clamp(24px, 4vw, 30px); line-height: 1.2; margin: 0 0 8px;
  }
  .wrap > p { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 28px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
  textarea {
    width: 100%; min-height: 140px; resize: vertical; border: none; outline: none;
    background: transparent; color: var(--ink); font-family: 'Source Serif 4', Georgia, serif;
    font-size: 17px; line-height: 1.5; padding: 0;
  }
  textarea::placeholder { color: var(--ink-soft); opacity: .7; }

  .row { display: flex; align-items: center; justify-content: flex-end; margin-top: 16px; }
  button.primary {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px;
    padding: 11px 22px; font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button.primary:disabled { opacity: .4; cursor: default; }
  button.primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .result { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px; }
  .placeholder { color: var(--ink-soft); font-size: 14.5px; }
  .verdict { font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

  .track { position: relative; height: 6px; border-radius: 3px; margin-top: 18px;
    background: linear-gradient(to right, var(--negative), var(--line) 50%, var(--positive)); }
  .marker { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--ink); transform: translate(-50%, -50%);
    transition: left .3s ease; left: 50%; }
  .labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  .error { color: var(--negative); font-size: 13.5px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>What's the verdict?</h1>
  <p>Paste a review below. Your model scores it and this shows how strongly it leans.</p>

  <div class="panel">
    <textarea id="input" placeholder="This film wasted two hours of my life..."></textarea>
    <div class="row">
      <button class="primary" id="analyze" disabled>Analyze</button>
    </div>

    <div class="result">
      <div id="empty" class="placeholder">Nothing analyzed yet.</div>
      <div id="resultBody" style="display:none">
        <div class="verdict" id="verdict">—</div>
        <div class="sub" id="subline"></div>
        <div class="track"><div class="marker" id="marker"></div></div>
        <div class="labels"><span>negative</span><span>positive</span></div>
      </div>
      <div id="errorBox" class="error" style="display:none"></div>
    </div>
  </div>
</div>

<script>
// ---- Point this at wherever your Flask/FastAPI app serves the Keras model. ----
const ENDPOINT = '/predict';

const input = document.getElementById('input');
const analyzeBtn = document.getElementById('analyze');
const empty = document.getElementById('empty');
const resultBody = document.getElementById('resultBody');
const verdict = document.getElementById('verdict');
const subline = document.getElementById('subline');
const marker = document.getElementById('marker');
const errorBox = document.getElementById('errorBox');

input.addEventListener('input', () => {
  analyzeBtn.disabled = input.value.trim().length === 0;
});

// Turns the model's sigmoid output (0..1) into a label.
// 0.56 falls in the 0.5-0.6 band below -> "Slightly positive", matching your example.
function labelFor(p){
  if (p >= 0.8) return { text: 'Very positive', tone: 'positive' };
  if (p >= 0.6) return { text: 'Positive', tone: 'positive' };
  if (p >= 0.5) return { text: 'Slightly positive', tone: 'positive' };
  if (p >= 0.4) return { text: 'Slightly negative', tone: 'negative' };
  if (p >= 0.2) return { text: 'Negative', tone: 'negative' };
  return { text: 'Very negative', tone: 'negative' };
}

async function analyze(text){
  const res = await fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ review: text })
  });
  if (!res.ok) throw new Error('Server returned ' + res.status);
  const data = await res.json();
  // Expects { probability: 0.56 } - adjust the key name if your Flask route returns something else.
  return data.probability;
}

analyzeBtn.addEventListener('click', async () => {
  const text = input.value.trim();
  if (!text) return;
  errorBox.style.display = 'none';
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = 'Analyzing...';
  try {
    const p = await analyze(text);
    const { text: label, tone } = labelFor(p);
    empty.style.display = 'none';
    resultBody.style.display = 'block';
    verdict.textContent = label;
    verdict.style.color = tone === 'positive' ? 'var(--positive)' : 'var(--negative)';
    subline.textContent = `raw score: ${p.toFixed(2)}`;
    marker.style.left = (p * 100) + '%';
  } catch (err) {
    resultBody.style.display = 'none';
    empty.style.display = 'none';
    errorBox.style.display = 'block';
    errorBox.textContent = 'Could not reach the model: ' + err.message;
  } finally {
    analyzeBtn.disabled = input.value.trim().length === 0;
    analyzeBtn.textContent = 'Analyze';
  }
});
</script>
</body>
</html>
